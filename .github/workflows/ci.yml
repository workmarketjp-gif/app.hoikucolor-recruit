name: CI

on:
  push:
    branches: [main, automation/hc-native-ca02-20260920]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Guard jobseeker application contract
        run: |
          set -euo pipefail
          grep -Fq "'new', 'hoiku_color_jobseeker', v_user_id" supabase/migrations/20260906160000_hc_jobseeker_portal.sql
          grep -Fq "check (source_type in ('manual','market','hoiku_color_jobseeker'))" supabase/migrations/20260910080000_hc_jobseeker_application_source_type_contract.sql
          grep -Fq "hc_applications_jobseeker_job_unique" supabase/migrations/20260910205000_hc_jobseeker_application_idempotency_and_availability.sql
          grep -Fq "and f.status = 'active'" supabase/migrations/20260910205000_hc_jobseeker_application_idempotency_and_availability.sql
          grep -Fq "client().rpc('hc_jobseeker_submit_application'" src/lib/recruitRepository.ts
          grep -Fq "submitApplication(job.id, profile)" src/App.tsx
          if grep -Fq 'href={`${publicUrl}/jobs/${job.id}`}' src/App.tsx; then
            echo 'broken public mock job detail link reintroduced' >&2
            exit 1
          fi
      - name: Guard HC-W01 profile preferences and document vault UX
        run: |
          node qa/jobseeker-profile-matching-contract.mjs
          node qa/document-vault-contract.mjs
      - name: Guard HC-W02 saved closed-job visibility
        run: node qa/jobseeker-saved-closed-state-contract.mjs
      - name: Guard Native CA-04 document camera recovery slice
        working-directory: native
        run: npm run test:camera-document-capture
      - name: Guard candidate message safe read
        run: node qa/jobseeker-message-safe-read-contract.mjs
      - name: Guard Native mobile foundation production rebase
        run: node qa/native-mobile-foundation-rebase-contract.mjs
      - name: Guard Native backend rollout bundle
        run: node qa/native-backend-rollout-bundle-contract.mjs
      - name: Guard Native release compatibility runtime
        working-directory: native
        run: node qa/native-release-compatibility-contract.mjs
      - name: Guard Native mobile idempotency production rebase
        run: node qa/native-mobile-idempotency-rebase-contract.mjs
      - name: Guard Native push pipeline production rebase
        run: node qa/native-push-pipeline-rebase-contract.mjs
      - name: Guard Native push client ABI
        run: node qa/native-push-client-core-contract.mjs
      - name: Guard Native account deletion production rebase
        run: node qa/native-account-deletion-production-rebase-contract.mjs
      - name: Guard Native shared-identity deletion freeze
        run: node qa/native-account-deletion-shared-identity-freeze-contract.mjs
      - name: Guard Native account deletion Push quarantine
        run: node qa/native-account-deletion-push-quarantine-contract.mjs
      - name: Guard Native account deletion client gate
        working-directory: native
        run: node qa/native-account-deletion-client-gate-contract.mjs
      - name: Guard Native private session core
        working-directory: native
        run: node qa/native-private-session-core-contract.mjs
      - name: Guard Native notification context core
        working-directory: native
        run: node qa/native-notification-context-core-contract.mjs
      - name: Guard Native root runtime boundary
        working-directory: native
        run: node qa/native-root-runtime-contract.mjs
      - name: Guard Native CA-01 runnable shell
        working-directory: native
        run: node qa/native-ca01-shell-contract.mjs
      - name: Guard Native CA-02 application/deep-link journey
        working-directory: native
        run: node qa/native-ca02-application-deeplink-contract.mjs
      - name: Guard Native CA-04 ambiguous application recovery
        working-directory: native
        run: node qa/native-ca04-application-ambiguity-contract.mjs
      - name: Guard Native CA-04 safe document replacement
        working-directory: native
        run: node qa/native-ca04-document-replacement-contract.mjs
      - name: Typecheck materialized Native source
        run: npx tsc -p native/qa/tsconfig.stub.json
      - name: Typecheck Native account deletion client slice
        run: npx tsc -p native/qa/tsconfig.account-deletion-client.json
      - name: Typecheck materialized Native push client core
        run: npx tsc -p native/qa/tsconfig.push-core.json
      - run: npm run build
